        @font-face {

        }

        }

            background-position: center;

            font-family: 'GastonFont';
            min-height: 100vh;
            display: flex;
            justify-content: space-between;
            align-items: center;

        }

        input {
            background-color: black;
            border-radius: none;
            border-color: rgb(252, 253, 252);
            text-align: center;
            color: rgb(237, 241, 237);
            width: 100%;
            min-width: 35vh;
            height: 5vh;
            outline: none;
        }

        input:focus {

        }

        .text-begin {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            margin: auto 0;
            
        }

        .text-begin h1{
            text-align: center;
            padding: auto;
            padding-bottom: 15vh;
            font-size: 2vw;
            white-space: nowrap;
        }    
        
        .user {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 400px;
        }

        #ansButton {
            background: none;
            color: rgb(255, 255, 255);
            font-family: 'GastonFont';
            font-weight: bold;
            border: 3px solid white;
            padding: 15px;
            border-radius: none;
            display: flex;
        }

        #ansButton img {
            width: 16px;
            object-fit: contain;
        }

        .hidden {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #answer {
            padding-bottom: 50px;
            min-height: 150px;
            text-align: center;
            text-justify: center;
            color: rgb(0, 255, 34);
            transition: opacity 0.5s ease;
            font-size: 1.3rem;
            white-space: pre-line;
        }










        #screamer {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            background: black;
            justify-content: center;
            align-items: center;
        }

        #screamer img {
            width: 30%;
        }















        @media (max-width: 600px) {

                align-items: center;

            }

            }

            }

            .text-begin p {
                font-size: 0.9rem;
            }

            #answer {
                font-size: 1.1rem;
                padding: 8px 4px;
            }

            .user {
                gap: 12px;
            }

            #ansButton {
                font-size: 1rem;
            }

            #screamer img {
                width: 80%;
            }


        }

</head>

        function random(arr){
            return arr[Math.floor(Math.random()*arr.length)];
        }


        let screamerTimeout;
        let musicFadeInterval;

        function triggerScreamer(screamer) {
            const screen = document.getElementById("screamer");
            const img = screen.querySelector("img");
            clearTimeout(screamerTimeout);

            img.src = screamer.image;
            screen.style.display = "flex";

            const sound = new Audio(screamer.sound);
            sound.play().catch(() => {});

            screamerTimeout = setTimeout(() => {
                screen.style.display = "none";
                sound.pause();
                sound.currentTime = 0;
                location.reload();
            }, screamer.duration);    
        }
        
        

        function stopBackgroundMusic() {
            backgroundMusic.pause();
            backgroundMusic.currentTime = 0;
        }





        function setResponse(text){
            const box = document.getElementById("answer");
            box.classList.add("hidden");
            setTimeout(() => {
                box.textContent = text;
                box.classList.remove("hidden");
            }, 500);
        }
 

        function getResponse(text){
            const msg = text.toLowerCase();

            

            if(msg.includes("кто ты") || msg.includes("твоё имя") || msg.includes("что ты")){
                return random(responces.identity);
            }

            if(msg.includes("где ты")){
                return random(responces.location);
            }


            if(msg.includes("смерть") || msg.includes("мёртв") || msg.includes("мертва") || msg.includes("умри") ){
                return random(responces.death);
            }

            if(msg.includes("=)") ){
                return random(responces.smile);
            }

            if(msg.includes("яйцо") || msg.includes("яйца") || msg.includes("дерево") || msg.includes("мужчина") ){

            }

            }

                return random(responces.dohodiaga);
            }

            if(msg.includes("бомба") || msg.includes("ядерка")  ){

            }

            if(msg.includes("ты существуешь") || msg.includes("существуешь")  ){

            }

            }

            }

            }

            } 

            if(msg.includes("титан")  ){

            }

            }

            }

            }

            if(msg.includes("тьма") || msg.includes("темнота")  ){

            }

            for(let word of storyWords){
                if(msg.includes(word)){

        function processInput(){
            const input = document.getElementById("question");
            const value = input.value.trim();

            if(!value){
                return;
            }

            const msg = value.toLowerCase();

            const matchedScreamer = screamers.find(screamer => 
                screamer.words.some(word => msg.includes(word))
            );

            input.disabled = true;
            input.value = "";

            const delay = Math.random() * 2500 + 1000;

            setTimeout(async () => {
                if(matchedScreamer) {
                    stopBackgroundMusic();
                    triggerScreamer(matchedScreamer);
                } else {
                    const responce = getResponse(value);
                    setResponse(responce);
                }

                input.disabled = false;
                input.focus();
                
            }, delay);
        }

        document.getElementById("question").addEventListener("keydown", function(e){
            if(e.key === "Enter"){
                processInput();
            }
        });

        document.getElementById("ansButton").addEventListener("click", processInput);
